<!DOCTYPE html>
<html lang="en">

<head>
	<title>Let's Interact</title>

	<!-- Meta Tags -->
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Life on Land - Sustainability" />
	<meta name="author" content="Group">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" href="css/style.css" />
	
	<!-- Favicon -->
	<link rel="icon" href="img/favicon.ico?v=2">
	
	<!-- JS Conections-->
	<script defer src="js/include.js"></script>
	<script defer src="js/forest_game.js"></script>
	<script src="https://kit.fontawesome.com/57a310552d.js" crossorigin="anonymous"></script> <!--Icons-->

</head>

<body>
	<div id="container"> <!-- Container (Bootstrap) -->
	
		<!-- Add Navbar and Submenu with JS -->
		<header class="sticky-top" >
			<div id="navbarAdd"></div>
			<div id="submenuAdd"></div>
		</header>
		
		<!--Tittle of the topic -->
		<section class="sectionTittle hero-section">
			<span class="sectionLifeTittle">FOREST &amp; DEFORESTATION</span>
			<h1 class="sectionMainTittle display-4">Quiz</h1>
			<!-- <p class="sectionBDes lead mt-3 mx-auto" >
			Tackling the loss of productive land globally to safeguard ecosystems, food security, and livelihoods. Join
			us in restoring a healthier planet.
			</p> -->
		</section>
		
		
		<div class="main">
			
			<div class="pageContent navBackTo">
				<i class="text-success fa-solid fa-chevron-left"></i>
				<a href="forest.html" class="btn-link" >Back to Forest and Deforestation</a>
			</div>
			
			
			<!-- Interaction created working with ChatGPT --> 
			<!-- Inspirations from https://www.justinmind.com/ui-design/progress-bars -->
		
			<div class="pageContent" id="forestInteraction">
				<div class="quizContainer" id="quizQuestions">
					<p class="step-number">Question <span id="stepNumber">1</span> of 5</p>


					<h2 id="stepTitle">How much forest is lost each year?</h2>
					
					<!-- Instructions -->
					<p id="stepText">Instructions </p>

					<!-- Options to select -->
					<div id="stepOptions" class="options-grid">
						<button class="option-btn" data-correct="false">1 million hectares</button>
						<button class="option-btn" data-correct="true">10 million hectares</button>
						<button class="option-btn" data-correct="false">100 million hectares</button>
					</div>

					<!-- Information about the answer -->
					<p id="feedbackText" class="feedbackText"></p>

					<!-- Next Question or Finish Button -->
					<button id="nextStepBtn" class="step-main-btn" disabled>Next</button>
					
					<!-- Dots for each question -->
					<div class="step-progress">
						<span class="dot active"></span>
						<span class="dot"></span>
						<span class="dot"></span>
						<span class="dot"></span>
						<span class="dot"></span>
					</div>
					
				</div>
				
				<div id="quizResult" class="quizContainer" style="display:none;">
					<h2 id="resultTitle"></h2>
					<p id="resultText"></p>

					<div>
						<a href="goals.html" class="btn-link">Learn more about the 17 Goals</a>
					</div>
				</div>
					
			</div>
		
		

		</div>
		
		<!-- Add Footer with JS -->
		<footer id="footerAdd"></footer>
	
	</div> <!-- END Container -->
	
</body>
</html>
