<!DOCTYPE html>
<html lang="en">

<head>
	<title>Let's Interact</title>

	<!-- Meta Tags -->
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Life on Land - Sustainability" />
	<meta name="author" content="Group">

	<!-- Bootstrap -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
	crossorigin="anonymous"></script>
	
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<!-- CSS -->
	<link rel="stylesheet" href="css/style.css" />
	
	<!-- JS Conections-->
	<script defer src="js/include.js"></script>
	<script src="https://kit.fontawesome.com/57a310552d.js" crossorigin="anonymous"></script> <!--Icons-->

</head>

<body>
	<div id="container"> <!-- Container (Bootstrap) -->
	
		<!-- Add Navbar and Submenu with JS -->
		<header id="mainNavbar" class="sticky-top" >
			<div id="navbarAdd"></div>
			<div id="submenuAdd"></div>
		</header>
		
		<!--Tittle of the topic -->
		<section class="sectionTittle hero-section">
			<span class="sectionLifeTittle">LIFE ON LAND</span>
			<h1 class="sectionMainTittle display-4">Forest &amp; Deforestation</h1>
			<!-- <p class="sectionBDes lead mt-3 mx-auto" >
			Tackling the loss of productive land globally to safeguard ecosystems, food security, and livelihoods. Join
			us in restoring a healthier planet.
			</p> -->
		</section>
		
		
		<div class="main">
			
			<!-- Interaction created working with ChatGPT --> 
			<!-- Inspirations from https://www.justinmind.com/ui-design/progress-bars -->
		
			<div class="pageContent" id="forestInteraction">
				<div class="step-card">
					<p class="step-number">Question <span id="stepNumber">1</span> of 5</p>


					<h2 id="stepTitle">How much forest is lost each year?</h2>
					
					<!-- Instructions -->
					<p id="stepText">Instructions </p>

					<!-- Options to select -->
					<div id="stepOptions" class="options-grid">
						<button class="option-btn" data-correct="false">1 million hectares</button>
						<button class="option-btn" data-correct="true">10 million hectares</button>
						<button class="option-btn" data-correct="false">100 million hectares</button>
					</div>

					<!-- Information about the answer -->
					<p id="feedbackText" class="feedbackText"></p>

					<!-- Next Question or Finish Button -->
					<button id="nextStepBtn" class="step-main-btn" disabled>Next</button>
					
					<!-- Dots for each question -->
					<div class="step-progress">
						<span class="dot active"></span>
						<span class="dot"></span>
						<span class="dot"></span>
						<span class="dot"></span>
						<span class="dot"></span>
					</div>
				</div>
			</div>
		
		

		</div>
		
		<!-- Add Footer with JS -->
		<footer id="footerAdd"></footer>
	
	</div> <!-- END Container -->
	
	<script>
	
		//Questions information
		let steps = [
			//Question 1
			{
				title: "What is deforestation?",
				text: "Forests are shrinking fast. Pick the closest number.",
				options: [
					{ text: "Trees losing their leaves naturally", correct: false },
					{ text: "Removing forests and converting the land to another use", correct: true },
					{ text: "Forests growing after rainfall", correct: false }
				],
				feedbackCorrect: "Correct. Deforestation means removing forests and changing how the land is used.",
				feedbackWrong: "No. Deforestation is when forests are removed and the land is converted to another use."
			},
			
			//Question 2
			{
				title: "Main cause of global forest loss",
				text: "Which human activity causes most deforestation worldwide?",
				options: [
					{ text: "Agriculture", correct: true },
					{ text: "Tourism", correct: false },
					{ text: "Public transport", correct: false }
				],
				feedbackCorrect: "Correct. Agriculture is the main cause of global forest loss.",
				feedbackWrong: "No. Agriculture is the activity that causes most deforestation worldwide."
			},

			//Question 3
			{
				title: "Forest degradation",
				text: "What is forest degradation?",
				options: [
					{ text: "When new trees are planted", correct: false },
					{ text: "When a forest grows faster than normal", correct: false },
					{ text: "When a forest becomes damaged but is not completely removed", correct: true }
				],
				feedbackCorrect: "Exactly. Degradation means the forest remains, but its quality declines.",
				feedbackWrong: "Not quite. Forest degradation happens when a forest is damaged but not completely removed."
			},


			//Question 4
			{
				title: "Forests and climate",
				text: "How do forests help the climate?",
				options: [
					{ text: "They absorb carbon dioxide from the atmosphere", correct: true },
					{ text: "They create fossil fuels naturally", correct: false },
					{ text: "They stop all storms from forming", correct: false }
				],
				feedbackCorrect: "Yes. Forests store carbon and help regulate the climate.",
				feedbackWrong: "Not right. Forests help the climate by absorbing carbon dioxide."
			},

			//Question 5
			{
				title: "Forest importance",
				text: "Why are forests essential for life on Earth?",
				options: [
					{ text: "They stop volcanoes from erupting", correct: false },
					{ text: "They produce electricity naturally", correct: false },
					{ text: "They support biodiversity and help regulate the climate", correct: true }
				],
				feedbackCorrect: "Right! Forests protect biodiversity and play a key role in stabilizing the climate.",
				feedbackWrong: "No. Forests are essential because they support biodiversity and regulate the climate."
			}
		  
		];

		let currentStep = 0;
		let answered = false;

		//Getting the elements from html
		let stepNumber = document.getElementById("stepNumber");
		let stepTitle  = document.getElementById("stepTitle");
		let stepText   = document.getElementById("stepText");
		let stepOptions = document.getElementById("stepOptions");
		let feedbackText = document.getElementById("feedbackText");
		let nextStepBtn  = document.getElementById("nextStepBtn");
		let dots = document.querySelectorAll(".step-progress .dot");

		function renderStep() {
		
			//Moving to the next question
			let step = steps[currentStep];
			stepNumber.textContent = currentStep + 1;
			stepTitle.textContent  = step.title;
			stepText.textContent   = step.text;
			feedbackText.textContent = "";
			nextStepBtn.textContent = currentStep === steps.length - 1 ? "Finish" : "Next";
			nextStepBtn.disabled = true;
			answered = false;
		  

			// update dots
			dots.forEach((dot, i) => {
				dot.classList.toggle("active", i === currentStep);
			});

			// build options
			stepOptions.innerHTML = "";
			step.options.forEach(opt => {
				let btn = document.createElement("button");
				btn.className = "option-btn";
				btn.textContent = opt.text;
				btn.addEventListener("click", () => handleOptionClick(btn, opt.correct));
				stepOptions.appendChild(btn);
			});
		}

		function handleOptionClick(btn, isCorrect) {
			if (answered) return;
			answered = true;

			// desactivar demás botones
			document.querySelectorAll(".option-btn").forEach(b => {
				b.disabled = true;
				if (b === btn) {
					b.classList.add(isCorrect ? "correct" : "wrong");
				}
			});

			let step = steps[currentStep];
			feedbackText.textContent = isCorrect ? step.feedbackCorrect : step.feedbackWrong;
			nextStepBtn.disabled = false;
		}


		// Check if the questionarie is finished and show the end of the game
		nextStepBtn.addEventListener("click", () => {
		  if (currentStep < steps.length - 1) {
			currentStep++;
			renderStep();
		  } else {
			// End of the game
			document.querySelector(".step-card").innerHTML = `
			  <h2>Great job!</h2>
			  <p>You’ve explored how forests are lost and what can help protect them </p>
			  <p>Now see how SDG 15 connects with your daily choices on this page.</p>
			`;
		  }
		});

		renderStep();
</script>
	
	
</body>
</html>
